<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StruggleMinigame</title>
        <link rel="stylesheet" href="../../Styles/Global.css">
        <link rel="stylesheet" href="../../Styles/Meter.css">
        <link rel="stylesheet" href="styles.css">
    </head>
    <style>
        :root {
            --minigame-offset-x: 50%;
            --minigame-offset-y: 65%;
            --combo-size: 10vh;
        }
    </style>
    <body class="main">
        <div id="mg_bar_cursor" class="mg_bar_base_large" style="left:var(--minigame-offset-x);top:var(--minigame-offset-y);display:none;">
            <div class="mg_bar mg_bar2_border"></div>
            <div style="left:0%;" class="mg_minigamezone"></div>
            <div id="mg_combo" style="left:calc(2.2*var(--meter-width));top:calc(var(--meter-height)/2);font-size:var(--combo-size);margin-top:calc(-1*var(--combo-size)/2);margin-left:calc(-1*var(--combo-size)/2);display:none;" id="mg_combo" class="mg_minigamezone_combo">0x</div>
            <div style="right:0%;" class="mg_minigamezone"></div>
            <div id="mg_cursor"></div>
        </div>
        <div id="mg_bar_health" class="mg_bar_base" style="left:var(--minigame-offset-x);top:calc(var(--minigame-offset-y) + 1.5*var(--meter-height));display:none;">
            <div class="mg_bar mg_bar_border"></div>
            <div id="mg_durability" class="mg_bar_fill"></div>
            <div id="mg_durability_bcg" class="mg_bar_fill mg_bar_background"></div>
        </div>
        <div id="mg_bar_condition" class="mg_bar_base" style="left:var(--minigame-offset-x);top:calc(var(--minigame-offset-y) + 2.5*var(--meter-height));display:none;">
            <div class="mg_bar mg_bar_border"></div>
            <div id="mg_condition_0" class="mg_bar_fill mg_condition"></div>
            <div id="mg_condition_bcg" class="mg_bar_fill mg_bar_background"></div>
        </div>
        <script src="script.js"></script>
        <script src="../../Scripts/InitMeters.js"></script>
    </body>
</html>
