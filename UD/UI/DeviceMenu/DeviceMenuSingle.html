<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>UnforgivingDevices</title>
        <link rel="stylesheet" href="../Styles/Global.css">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body id="main" style="display: none;" >
    <!-- <body id="main"> -->
        <div id="devicemenu"  class="background-dark border-main">
            <div id="dm_closebutton_container">
                <button id="dm_closebutton" onclick="_Exit(2)">X</button>
            </div>
            <div id="dm_stats">
                <table style="width:100%;">
                    <tr class="border-underline">
                        <th> Wearer: </th>
                        <th id="dm_wearer" style="width:25%;"> None </th>
                        <th> Helper: </th>
                        <th id="dm_helper" style="width:25%;"> None </th>
                    </tr>
                </table>
            </div>
            <div id="dm_table_container" class="background-gray">
                <table id="dm_table" >
                    <tr id="dm_line0" class="heading-row">
                        <th style="width:50%;"> Actions </th>
                        <th style="width:50%;"> Details </th>
                    </tr>
                    <tr id="dm_line1">
                        <th rowspan="3" class="background-light devicemenu_info">
                            <div id="dm_minigames" class="dm_scrollable">
                            </div>
                        </th>
                        <th class="background-light devicemenu_info">
                            <div class="dm_tab">
                              <button id="dm_tabdetailsbutton" class="dm_tablinks" onclick="SelectTab(event, 'dm_tabdetails')">Details</button>
                              <button id="dm_tablocksbutton"class="dm_tablinks" onclick="SelectTab(event, 'dm_tablocks')">Locks</button>
                            </div>
                            <div id="dm_tabdetails" class="dm_scrollable dm_tabcontent">
                                <table id="dm_detailtable" class="dm_detailtable">
                                </table>
                            </div>
                            <div id="dm_tablocks" class="dm_scrollable dm_tabcontent">
                                <div id="dm_locklist" class="dm_list dm_scrollable">
                                </div>
                                <table id="dm_lockstable" class="dm_lockstable">
                                </table>
                            </div>
                        </th>
                    </tr>
                    <tr id="dm_line2" >
                        <th class="heading-row">Modifiers</th>
                    </tr>
                    <tr id="dm_line3">
                        <th class="background-light devicemenu_info">
                            <div id="dm_modifiers" class="dm_scrollable">
                            </div>
                        </th>
                    </tr>
                </table>
            </div>
            <!-- <table id="dm_controlmenu"> -->
                <!-- <tr id="dm_con_callbacks"> -->
                <!-- </tr> -->
            <!-- </table> -->
        </div>
        <div id="dm_Detail" style="display: none;"></div>
        <div id="dm_Context" style="display: none;"></div>
        <script src="../Scripts/Global.js"></script>
        <script src="DeviceMenu.js"></script>
    </body>
</html>
